name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_ACCESS_KEY }}

      - name: Verify build output
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          test -f dist/CNAME || (echo "CNAME missing — required for shubhamsunny.com" && exit 1)
          grep -q 'shubhamsunny.com' dist/CNAME
          test -f dist/assets/css/styles.css || (echo "styles.css missing" && exit 1)
          grep -q 'href="assets/css/styles.css"' dist/index.html || (echo "CSS path must be relative" && exit 1)
          touch dist/.nojekyll

      - name: Publish dist to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          single-commit: true

      - name: Point Pages at gh-pages + custom domain
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${{ github.token }}"
          ACCEPT="Accept: application/vnd.github+json"
          VER="X-GitHub-Api-Version: 2022-11-28"
          URL="https://api.github.com/repos/${{ github.repository }}/pages"

          # Prefer classic branch deploy for reliable custom-domain binding
          BODY='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"},"cname":"shubhamsunny.com"}'
          CODE=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X PUT -H "$AUTH" -H "$ACCEPT" -H "$VER" "$URL" -d "$BODY")
          echo "PUT pages HTTP $CODE"
          cat /tmp/pages.json
          echo

          if [ "$CODE" -eq 404 ]; then
            echo "Pages site missing — creating..."
            CODE=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST -H "$AUTH" -H "$ACCEPT" -H "$VER" "$URL" \
              -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"},"cname":"shubhamsunny.com"}')
            echo "POST pages HTTP $CODE"
            cat /tmp/pages.json
            echo
          fi

          if [ "$CODE" -ge 400 ]; then
            echo "::warning::Could not auto-bind custom domain via API (HTTP $CODE)."
            echo "::warning::Do this once manually: Settings → Pages → Source = Deploy from a branch → gh-pages / (root), Custom domain = shubhamsunny.com, then Enforce HTTPS."
            exit 0
          fi

          # Enforce HTTPS (may fail until DNS/cert is ready)
          curl -sS -o /tmp/https.json -w "HTTPS enforce HTTP %{http_code}\n" -X PUT -H "$AUTH" -H "$ACCEPT" -H "$VER" "$URL" \
            -d '{"https_enforced":true}' || true
          cat /tmp/https.json || true

      - name: Smoke test
        continue-on-error: true
        run: |
          sleep 20
          for URL in \
            "https://shubhamsahaninitkkr.github.io/shubhamsunny.github.io/" \
            "https://shubhamsunny.com/" \
            "https://www.shubhamsunny.com/"
          do
            STATUS=$(curl -sS -L -o /tmp/page.html -w "%{http_code}" "$URL" || true)
            echo "$URL -> $STATUS"
          done
