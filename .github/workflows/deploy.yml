name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_ACCESS_KEY }}

      - name: Verify build output
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          test -f dist/CNAME || (echo "dist/CNAME missing" && exit 1)
          grep -q "shubhamsunny.com" dist/CNAME
          test -f dist/assets/css/styles.css || (echo "styles.css missing" && exit 1)
          touch dist/.nojekyll

      - name: Point GitHub Pages at gh-pages branch + custom domain
        run: |
          set -e
          BODY='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"},"cname":"shubhamsunny.com"}'
          CODE=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d "$BODY")
          echo "Pages config HTTP $CODE"
          cat /tmp/pages.json || true
          if [ "$CODE" -ge 400 ]; then
            echo "::warning::Could not auto-set Pages source. Set Settings → Pages → Deploy from branch → gh-pages / (root), custom domain shubhamsunny.com"
          fi

      - name: Enforce HTTPS on custom domain
        continue-on-error: true
        run: |
          curl -sS -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"https_enforced":true}' || true

      - name: Publish dist to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          single-commit: true

      - name: Smoke test
        continue-on-error: true
        run: |
          sleep 15
          for URL in \
            "https://shubhamsahaninitkkr.github.io/shubhamsunny.github.io/" \
            "https://shubhamsunny.com/"
          do
            STATUS=$(curl -sS -L -o /tmp/home.html -w "%{http_code}" "$URL" || true)
            echo "$URL -> HTTP $STATUS"
          done
