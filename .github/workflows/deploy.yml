name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_ACCESS_KEY }}

      - name: Verify build output
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          test -f dist/assets/css/styles.css || (echo "styles.css missing" && exit 1)
          test -f dist/CNAME || (echo "CNAME missing" && exit 1)
          grep -q 'shubhamsunny.com' dist/CNAME
          grep -q 'href="assets/css/styles.css"' dist/index.html || (echo "CSS path must be relative" && exit 1)
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Also publish to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          single-commit: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages + custom domain
        run: |
          set -e
          CODE=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow","cname":"shubhamsunny.com"}')
          echo "Pages config HTTP $CODE"
          cat /tmp/pages.json || true
          curl -sS -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"https_enforced":true}' || true

      - uses: actions/deploy-pages@v4
        id: deployment

      - name: Smoke test custom domain
        continue-on-error: true
        run: |
          for i in 1 2 3 4 5 6 8 10; do
            STATUS=$(curl -sS -L -o /tmp/home.html -w "%{http_code}" "https://shubhamsunny.com/" || true)
            echo "Attempt $i: shubhamsunny.com -> HTTP $STATUS"
            if [ "$STATUS" = "200" ] && grep -q "Shubham Sunny" /tmp/home.html; then
              echo "Custom domain is live"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Custom domain not 200 yet (DNS/cert may still be provisioning)."
