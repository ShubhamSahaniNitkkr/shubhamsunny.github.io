name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_ACCESS_KEY }}

      - name: Verify build output
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          test -f dist/CNAME || (echo "dist/CNAME missing" && exit 1)
          test -f dist/robots.txt || (echo "robots.txt missing" && exit 1)
          test -f dist/llms.txt || (echo "llms.txt missing" && exit 1)
          test -f dist/.well-known/llms.txt || (echo "llms.txt missing" && exit 1)
          test -f dist/site.webmanifest || (echo "site.webmanifest missing" && exit 1)
          test -f dist/assets/css/styles.css || (echo "styles.css missing" && exit 1)
          grep -q 'api.web3forms.com' dist/index.html || (echo "Web3Forms submit missing" && exit 1)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

      - name: Register custom domain with GitHub Pages
        uses: actions/github-script@v7
        with:
          script: |
            const cname = 'shubhamsunny.com';
            try {
              await github.rest.repos.updateInformationAboutPagesSite({
                owner: context.repo.owner,
                repo: context.repo.repo,
                build_type: 'workflow',
                cname,
                https_enforced: true,
              });
              core.info(`Registered custom domain: ${cname}`);
            } catch (error) {
              core.warning(
                `Could not register ${cname} via API (${error.status ?? 'unknown'}). ` +
                  'Set it manually under Settings → Pages → Custom domain if needed.'
              );
            }

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Smoke test custom domain
        run: |
          for i in 1 2 3 4 5 6 8 10; do
            STATUS=$(curl -sS -L -o /tmp/home.html -w "%{http_code}" "https://shubhamsunny.com" || true)
            echo "Attempt $i: https://shubhamsunny.com -> HTTP $STATUS"
            if [ "$STATUS" = "200" ] && grep -q "Shubham Sunny" /tmp/home.html; then
              echo "Site is live"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Site did not return 200 after deploy (may still be propagating)."
          exit 0
